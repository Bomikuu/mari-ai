<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f6" />
    <script>
      (() => {
        let saved;
        try { saved = localStorage.getItem('mari.theme'); } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0d18' : '#f6f6f6';
      })();
    </script>
    <meta name="description" content="Mari — your private local project and AI command center." />
    <title>Mari — Personal command center</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
